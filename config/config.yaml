# ============================================================
# Dataset
# ============================================================

dataset_path: dataset/clients/non_iid

num_clients: 5

# ============================================================
# Training
# ============================================================

batch_size: 32

# Local epochs per federated round
epochs: 3

learning_rate: 0.001

# ============================================================
# Federated Learning
# ============================================================

server_address: 127.0.0.1:9090

# Number of global federated rounds
num_rounds: 1

fraction_fit: 1.0
fraction_evaluate: 1.0

# ============================================================
# Model
# ============================================================

input_size: 42

hidden1: 128
hidden2: 64
hidden3: 32

output_size: 10

# ============================================================
# Device
# ============================================================

device: cpu

# ============================================================
# Secure Aggregation
# ============================================================

secure_aggregation:
  enabled: true
  num_shares: 5
  reconstruction_threshold: 3

# ============================================================
# adaptive communication
# ============================================================

adaptive_communication:
  enabled: false

# ============================================================
# Privacy
# ============================================================

privacy:
  enabled: true
  target_epsilon: 2.0
  target_delta: 0.00001
  max_grad_norm: 1.0
  accountant: prv
